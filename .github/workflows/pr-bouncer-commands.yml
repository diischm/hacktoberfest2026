name: PR Bouncer Commands

on:
  issue_comment:
    types: [created]

jobs:
  commands:
    if: >
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    # Same pinned commit as security-review.yml
    uses: BeyondMachines/pr-bouncer/.github/workflows/pr-commands.yml@e26494a0e76aa1ca0641f877e1b14eb83948a26c
