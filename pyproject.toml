[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Generated by `makemigrations`; Django writes class-level lists there by design.
"*/migrations/*" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests", "web/tests"]
# pytest-django: test settings force AI_MODE=mock so tests never call the real Gemini API
DJANGO_SETTINGS_MODULE = "config.settings_test"

[tool.bandit]
